# Runtime defaults. CLI flags and environment variables may override these values.
lanes=auto
jobs=auto
# Automatic resource profile; explicit --lanes/--jobs override its values.
intensity=xhigh
memory_per_job_gib=3
core_memory_per_job_gib=4
reserved_memory_gib=2
# The recipe-store format this tree is written for. The engine refuses to load
# a store whose format is newer than it understands (rc 2, naming the remedy)
# instead of misreading records it was never taught; absent means 1, so the
# engine's history stays readable. Bump this only together with a schema change
# that an older engine cannot parse.
store_format=1
