# /etc/gsa/gsa.conf — engine behaviour, the baseline layer (contract §B.11).
#
# Read as the BASELINE; the build user's ~/.config/gsa/gsa.conf overrides key
# by key, and the compiled-in rung answers when neither sets a key. This file
# is parsed strictly — `key = value`, one per line, `#` comments — never
# sourced as shell. An unknown key or a malformed line is refused (rc 2) with
# file:line and the key named.
#
# Keys:
#   project     workspace root (a recipe-repository checkout). Unset means
#               discover: the cwd walk, then the canonical store.
#   recipe_url  origin of the canonical recipe store.
#   build_dir   build cache root (BUILDDIR/PKGDIR/PKGDEST live under it).
#   state_dir   root-owned engine state (index/, runs/, locks/, toolchains/).
#   recipe_dir  canonical recipe store path.
#   srcdest     makepkg source cache. The engine owns this now: the SRCDEST
#               environment rung and both makepkg.conf rungs are retired.
#
# Every assignment below is deliberately commented out. The built-in defaults
# ARE the policy; writing them out would pin paths a different user does not
# have, and the engine's own rung already says where each value came from
# (`gsa -Q`/`gsa --help` provenance labels). `~` expands to the build user's
# home (SUDO_UID's home under sudo).
#
# The retired /etc/gsa.conf is IGNORED once this file exists — the engine says
# so once per process. Delete the old file after installing gsa-pm.

# project =
# recipe_url = https://github.com/ZhangDM-520/gsa-recipe.git
# build_dir = ~/.cache/gsa
# state_dir = /var/lib/gsa
# recipe_dir = ~/.local/share/gsa/recipes
# srcdest = ~/.gsa-src
